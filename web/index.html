<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #05070A; color: #EFEDE2;
    font-family: var(--sans); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .stage { position: fixed; inset: 0; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #fx { pointer-events: none; }

  /* Both corners are set at twice the original size: this page is a single
     object seen across a room, not a UI, so the chrome reads as signage. */
  .mark {
    position: fixed; top: 1.5rem; left: 1.6rem; z-index: 10;
    display: block; text-decoration: none;
  }
  /* The mark sits in the middle of a square canvas: measured on the file, the
     opaque pixels run x 424..1647 and y 632..1340 of 2048, so 20.7% of the
     width is empty to its left and 30.9% of the height above it. Positioning
     the image at the corner therefore hangs the mark low and to the right of
     where the corner appears to be. The margins pull it back by exactly that
     padding, 78*0.207 and 78*0.309, so the visible mark lands on 1.6rem/1.5rem
     rather than the transparent box around it. */
  .mark img { width: 78px; height: 78px; margin: -24px 0 0 -16px; object-fit: contain; display: block; }

  .links {
    position: fixed; top: 1.5rem; right: 1.7rem; z-index: 10;
    display: flex; align-items: center; gap: 1.7rem;
    font-size: 1.32rem; color: rgba(255,255,255,.74);
    text-shadow: 0 1px 10px rgba(0,0,0,.6);
  }
  .links a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; }
  .links a:hover { color: #fff; }
  .links .icon { width: 1.15em; height: 1.15em; fill: currentColor; display: block; }

  /* The endpoint, as something to take rather than somewhere to go. A button
     because it copies and does not navigate, and monospace because it is an
     address that gets pasted into a configuration file. */
  .copy {
    font: inherit; font-family: var(--mono); font-size: .72em; letter-spacing: -.01em;
    color: inherit; opacity: .78; background: none; border: 0; padding: 0;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .copy:hover, .copy:focus-visible { opacity: 1; }
  .copy.done { color: var(--lime); opacity: 1; }
  .copy.failed { color: var(--warn); opacity: 1; }

  .credit {
    position: fixed; left: 1.7rem; bottom: 1.5rem; z-index: 10; margin: 0;
    font-size: .92rem; font-weight: 400; letter-spacing: -.01em;
    color: rgba(255,255,255,.7); text-shadow: 0 1px 10px rgba(0,0,0,.6);
  }
  .credit strong { font-weight: 600; color: rgba(255,255,255,.92); }

  /* A census, not a presence count, and a link because the claim should be
     checkable: it goes to the endpoint the numbers came from. */
  .stats {
    position: fixed; right: 1.7rem; bottom: 1.5rem; z-index: 10;
    font-family: var(--mono); font-size: .74rem; letter-spacing: -.01em;
    color: rgba(255,255,255,.58); text-decoration: none;
    text-shadow: 0 1px 10px rgba(0,0,0,.6);
  }
  .stats:hover { color: rgba(255,255,255,.92); }
  .stats[hidden] { display: none; }

  /* A light treatment blows out white overlay text, so the chrome flips. */
  body[data-ui="light"] .mark { color: #14120C; text-shadow: 0 1px 10px rgba(255,255,255,.7); }
  body[data-ui="light"] .links { color: rgba(20,18,12,.68); text-shadow: 0 1px 8px rgba(255,255,255,.8); }
  body[data-ui="light"] .links a:hover { color: #14120C; }
  body[data-ui="light"] .copy.done { color: #5C7304; }
  body[data-ui="light"] .credit { color: rgba(20,18,12,.66); text-shadow: 0 1px 8px rgba(255,255,255,.8); }
  body[data-ui="light"] .credit strong { color: #14120C; }
  body[data-ui="light"] .stats { color: rgba(20,18,12,.6); text-shadow: 0 1px 8px rgba(255,255,255,.8); }
  body[data-ui="light"] .stats:hover { color: #14120C; }

  @media (max-width: 720px) {
    .mark img { width: 56px; height: 56px; margin: -17px 0 0 -12px; }
    .credit { font-size: .8rem; }
    .links { font-size: 1rem; gap: .9rem; }
    .copy { font-size: .68em; }
  }
  /* Below this the address crowds the mark, and copying an endpoint on a phone
     is not what anyone is here to do. The icon stays. */
  @media (max-width: 560px) { .stats { display: none; } }
  @media (max-width: 430px) { .copy { display: none; } }
</style>

<p class="credit">Routed through <strong>Robinhood Chain</strong></p>

<a class="stats" href="https://mcp.meap.fun/state" target="_blank" rel="noopener"
   title="The whole economy, as JSON. No token needed to read it." hidden></a>

<script>
  // Copy the endpoint. navigator.clipboard needs a secure context and can be
  // refused outright, so the old selection trick stays as a fallback rather
  // than letting the click silently do nothing.
  (() => {
    const btn = document.querySelector('.copy');
    if (!btn) return;
    const label = btn.textContent;
    let timer;
    btn.addEventListener('click', async () => {
      const text = btn.dataset.copy;
      let ok = false;
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:-999px;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        try { ok = document.execCommand('copy'); } catch { /* nothing left to try */ }
        ta.remove();
      }
      // Say so either way. A click that silently does nothing reads as broken,
      // and a refused clipboard is the one outcome the page cannot control.
      btn.textContent = ok ? 'copied' : 'copy failed';
      btn.classList.toggle('done', ok);
      btn.classList.toggle('failed', !ok);
      clearTimeout(timer);
      timer = setTimeout(() => { btn.textContent = label; btn.classList.remove('done', 'failed'); }, 1300);
    });
  })();
</script>

<script>
  // The census, read from the endpoint itself.
  //
  // Deliberately not "online". Nothing here holds a connection: MCP over HTTP
  // is request and response, so an address that acted a second ago and one
  // that has not returned in a month look identical. What can be said honestly
  // is how many addresses exist, how many markets they have declared, and how
  // many actions the log holds.
  //
  // If the endpoint is unreachable the line stays hidden rather than showing a
  // zero, because a zero would be a claim and an outage is not one.
  (() => {
    const el = document.querySelector('.stats');
    if (!el) return;
    const n = (v, one, many) => `${v} ${v === 1 ? one : many}`;
    async function refresh() {
      try {
        const r = await fetch('https://mcp.meap.fun/state', { cache: 'no-store' });
        if (!r.ok) throw new Error(r.status);
        const d = await r.json();
        el.textContent = [
          n(d.agents.length, 'agent', 'agents'),
          n(d.markets.length, 'market', 'markets'),
          n(d.actions, 'action', 'actions'),
        ].join(' · ');
        el.hidden = false;
      } catch {
        el.hidden = true;
      }
    }
    refresh();
    setInterval(refresh, 20000);
  })();
</script>

<script type="module" src="play/app.js"></script>
</body>
