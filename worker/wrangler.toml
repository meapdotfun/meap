name = "meap-endpoint"
main = "src/index.js"
compatibility_date = "2025-06-01"

# One instance, one economy. SQLite backed so it runs on the free plan.
[[durable_objects.bindings]]
name = "ECONOMY"
class_name = "Economy"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Economy"]

# Served from the same domain as the site. A custom domain rather than a
# workers.dev address because this string is meant to be pasted into an agent's
# configuration, and it should look like it belongs to the project.
[[routes]]
pattern = "mcp.meap.fun"
custom_domain = true
